version: '3'

services:
  db:
    image: postgres:13.1
    volumes: 
      - "$PWD/db/onDBOpen:/docker-entrypoint-initdb.d"
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  middletier:
    build:
      context: ./middletier/.devcontainer
      dockerfile: Dockerfile
      args:
        # Update 'VARIANT' to pick an version of Java: 11, 17.
        # Append -bullseye or -buster to pin to an OS version.
        # Use -bullseye variants on local arm64/Apple Silicon.
        VARIANT: "11"
        # Options
        INSTALL_MAVEN: "true"
        MAVEN_VERSION: ""
        INSTALL_GRADLE: "false"
        GRADLE_VERSION: ""
        NODE_VERSION: "none"
    command: /bin/bash -c "cd ./middletier;./scripts/watchTomee.sh run"
    volumes:
      - "$PWD/middletier:/middletier"
    depends_on:
      - db
  frontend:
    image: node:16
    command: bash -c "cd /frontend && yarn && yarn start"
    volumes: 
      - "$PWD/frontend:/frontend"
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true