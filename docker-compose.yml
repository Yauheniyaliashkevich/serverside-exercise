version: '3'

services:
  db:
    image: postgres:13.1
    volumes: 
      - "$PWD/db/onDBOpen:/docker-entrypoint-initdb.d"
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  mt_build:
    image: maven:3.8.6-jdk-11
    command: sleep 5s;
    volumes:
      - "$PWD/middletier:/middletier"
